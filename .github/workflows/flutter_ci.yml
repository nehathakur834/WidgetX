name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Package: widgetx_ui ──────────────────────────────────────────────────────
  package:
    name: widgetx_ui package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: packages/widgetx_ui

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
        working-directory: packages/widgetx_ui

      - name: Static analysis
        run: flutter analyze
        working-directory: packages/widgetx_ui

      - name: Run tests
        run: flutter test --reporter=compact
        working-directory: packages/widgetx_ui

  # ── Showcase application ─────────────────────────────────────────────────────
  showcase:
    name: Showcase application
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter=compact

      - name: Build web
        run: flutter build web --release --base-href /widgetx_ui/

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: showcase-web
          path: build/web
          retention-days: 7
